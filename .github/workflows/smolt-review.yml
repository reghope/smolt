# Written by smolt's /review setup. Re-running the command updates it;
# /review setup --remove deletes it.
name: Smolt review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: smolt-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@smolt review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    env:
      SMOLT_PROVIDER: ${{ vars.SMOLT_PROVIDER || 'opencode-go' }}
      SMOLT_MODEL: ${{ vars.SMOLT_MODEL || 'glm-5.3-flash' }}
    steps:
      # With a smolt GitHub App configured, every comment and check comes from
      # 'smolt[bot]' with the pixelfish avatar; without one, from github-actions.
      - name: Mint the smolt app token
        id: app
        if: vars.SMOLT_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.SMOLT_APP_ID }}
          private-key: ${{ secrets.SMOLT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          MANUAL: ${{ github.event_name == 'issue_comment' }}
          ALL_BASES: ${{ vars.SMOLT_REVIEW_ALL_BASES }}
        run: |
          read -r head base default < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" \
            --jq '"\(.head.sha) \(.base.ref) \(.base.repo.default_branch)"')
          {
            echo "number=$NUMBER"
            echo "head_sha=$head"
            echo "base_ref=$base"
            echo "default_branch=$default"
          } >> "$GITHUB_OUTPUT"
          if [ "$base" != "$default" ] && [ "$MANUAL" != "true" ] && [ "$ALL_BASES" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Announce a skipped review
        if: steps.pr.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          DEFAULT_BRANCH: ${{ steps.pr.outputs.default_branch }}
        run: node .github/smolt-review-comment.mjs skipped
      - name: Claim the status comment
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          DEFAULT_BRANCH: ${{ steps.pr.outputs.default_branch }}
        run: node .github/smolt-review-comment.mjs processing
      - name: Install smolt
        if: steps.pr.outputs.skip != 'true'
        run: npm install -g smolt
      - name: Review the pull request
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          DEFAULT_BRANCH: ${{ steps.pr.outputs.default_branch }}
          # The credential for the chosen provider, from a repository secret.
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: smolt -p "$(node -e "process.stdout.write(require('fs').readFileSync('.github/smolt-review-prompt.md','utf8'))")"
      - name: Report a failed review
        if: failure() && steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: node .github/smolt-review-comment.mjs failed
